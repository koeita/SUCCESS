<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション（知的なダークネイビー〜スタディブルー） -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d3557" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- 桜の花びらグラデーション -->
    <linearGradient id="sakuraGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="60%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#fff1f2" />
    </linearGradient>

    <!-- ゴールドアクセントグラデーション -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- ハチマキグラデーション -->
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- 立体ドロップシャドウ -->
    <filter id="popShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#050b14" flood-opacity="0.6" />
    </filter>
    <filter id="motifShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#091426" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 背景ベース（丸角正方形） -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- 背景サクセス光彩パターン（集中線・グロー） -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#60a5fa" stroke-width="3" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="130" fill="#38bdf8" fill-opacity="0.08" />

  <!-- 外枠（サクセス太枠線） -->
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.3" />

  <!-- モチーフ全体グループ（シャドウ付き） -->
  <g filter="url(#popShadow)">

    <!-- 1. 背面の交差するペンシル・ペン先（学業のシンボル） -->
    <g transform="translate(256, 230)">
      <!-- 左上から右下のペン -->
      <g transform="rotate(45)">
        <rect x="-18" y="-120" width="36" height="240" rx="6" fill="#f8fafc" stroke="#1d3557" stroke-width="5" />
        <path d="M -18 120 L 0 160 L 18 120 Z" fill="url(#goldGrad)" stroke="#1d3557" stroke-width="5" />
        <circle cx="0" cy="138" r="4" fill="#1d3557" />
        <rect x="-18" y="-120" width="36" height="30" fill="#e11d48" stroke="#1d3557" stroke-width="5" />
      </g>
      <!-- 右上から左下のペン -->
      <g transform="rotate(-45)">
        <rect x="-18" y="-120" width="36" height="240" rx="6" fill="#f8fafc" stroke="#1d3557" stroke-width="5" />
        <path d="M -18 120 L 0 160 L 18 120 Z" fill="url(#goldGrad)" stroke="#1d3557" stroke-width="5" />
        <circle cx="0" cy="138" r="4" fill="#1d3557" />
        <rect x="-18" y="-120" width="36" height="30" fill="#2563eb" stroke="#1d3557" stroke-width="5" />
      </g>
    </g>

    <!-- 2. ゴールド月桂樹・栄冠のリーフ（左＆右） -->
    <g fill="url(#goldGrad)" stroke="#1d3557" stroke-width="4">
      <!-- 左側リーフ -->
      <path d="M 120 280 C 100 240, 110 190, 140 160 C 135 185, 145 210, 160 225 Z" />
      <path d="M 110 330 C 85 300, 90 260, 120 235 C 120 255, 130 275, 150 285 Z" />
      <path d="M 130 380 C 105 360, 105 320, 130 295 C 135 315, 150 330, 170 335 Z" />
      <!-- 右側リーフ -->
      <path d="M 392 280 C 412 240, 402 190, 372 160 C 377 185, 367 210, 352 225 Z" />
      <path d="M 402 330 C 427 300, 422 260, 392 235 C 392 255, 382 275, 362 285 Z" />
      <path d="M 382 380 C 407 360, 407 320, 382 295 C 377 315, 362 330, 342 335 Z" />
    </g>

    <!-- 3. 中央の満開の桜（サクセス・合格の花） -->
    <g transform="translate(256, 225)">
      <!-- 5枚の花びら -->
      <!-- 上 -->
      <g transform="rotate(0)">
        <path d="M 0 0 C -38 -45, -44 -95, -16 -125 C -5 -110, 5 -110, 16 -125 C 44 -95, 38 -45, 0 0 Z" fill="url(#sakuraGrad)" stroke="#1d3557" stroke-width="5" />
      </g>
      <!-- 右上 -->
      <g transform="rotate(72)">
        <path d="M 0 0 C -38 -45, -44 -95, -16 -125 C -5 -110, 5 -110, 16 -125 C 44 -95, 38 -45, 0 0 Z" fill="url(#sakuraGrad)" stroke="#1d3557" stroke-width="5" />
      </g>
      <!-- 右下 -->
      <g transform="rotate(144)">
        <path d="M 0 0 C -38 -45, -44 -95, -16 -125 C -5 -110, 5 -110, 16 -125 C 44 -95, 38 -45, 0 0 Z" fill="url(#sakuraGrad)" stroke="#1d3557" stroke-width="5" />
      </g>
      <!-- 左下 -->
      <g transform="rotate(216)">
        <path d="M 0 0 C -38 -45, -44 -95, -16 -125 C -5 -110, 5 -110, 16 -125 C 44 -95, 38 -45, 0 0 Z" fill="url(#sakuraGrad)" stroke="#1d3557" stroke-width="5" />
      </g>
      <!-- 左上 -->
      <g transform="rotate(288)">
        <path d="M 0 0 C -38 -45, -44 -95, -16 -125 C -5 -110, 5 -110, 16 -125 C 44 -95, 38 -45, 0 0 Z" fill="url(#sakuraGrad)" stroke="#1d3557" stroke-width="5" />
      </g>

      <!-- 花芯（ゴールドスター＆おしべ） -->
      <circle cx="0" cy="0" r="26" fill="url(#goldGrad)" stroke="#1d3557" stroke-width="4" />
      <polygon points="0,-16 5,-5 16,-5 8,3 11,14 0,8 -11,14 -8,3 -16,-5 -5,-5" fill="#ffffff" />
    </g>

    <!-- 4. 前面の合格ハチマキ（必勝リボン） -->
    <g transform="translate(256, 380)">
      <!-- ハチマキの垂れ（左） -->
      <path d="M -50 0 C -80 30, -100 80, -110 110 L -75 110 C -70 80, -50 40, -30 20 Z" fill="#e2e8f0" stroke="#1d3557" stroke-width="5" />
      <!-- ハチマキの垂れ（右） -->
      <path d="M 50 0 C 80 30, 100 80, 110 110 L 75 110 C 70 80, 50 40, 30 20 Z" fill="#e2e8f0" stroke="#1d3557" stroke-width="5" />

      <!-- ハチマキ本体（緩やかなアーチ帯） -->
      <path d="M -160 0 C -80 -18, 80 -18, 160 0 C 150 36, 140 46, 130 50 C 60 32, -60 32, -130 50 C -140 46, -150 36, -160 0 Z" 
            fill="url(#bandGrad)" stroke="#1d3557" stroke-width="6" />

      <!-- 中央の赤い情熱の日の丸マーク（合格・サクセス魂） -->
      <circle cx="0" cy="18" r="16" fill="#e11d48" stroke="#1d3557" stroke-width="3" />
    </g>

  </g>
</svg>
